<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Opret afstemning – Mødetid</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-header"><a class="app-header__logo" href="/">📅 Mødetid</a></header>
  <main class="container">
    <form class="card create-form" id="form" novalidate>
      <h1>Opret en afstemning</h1>
      <p class="lead">Foreslå tidspunkter, og del linket med deltagerne.</p>
      <div class="alert" id="summary" role="alert" aria-live="assertive"></div>
      <div class="field">
        <label class="field__label" for="title">Titel *</label>
        <input class="input" id="title" name="title" maxlength="200" placeholder="F.eks. Teammøde om Q4" aria-describedby="title-err">
        <div class="field__error" id="title-err" aria-live="polite"></div>
      </div>
      <div class="field">
        <label class="field__label" for="desc">Beskrivelse <span class="field__hint">(valgfri)</span></label>
        <textarea class="input" id="desc" name="description" maxlength="2000" placeholder="Hvad handler mødet om? Sted, link, agenda…"></textarea>
      </div>
      <h2 id="prop-h">Tidsforslag</h2>
      <p class="tz-note">Tidspunkter angives i din tidszone: <span id="tz"></span></p>
      <div class="add-date">
        <div class="field">
          <label class="field__label" for="newdate">Vælg dato</label>
          <input class="input" type="date" id="newdate" lang="da">
        </div>
        <button type="button" class="btn btn--secondary" id="adddate">+ Tilføj dato</button>
      </div>
      <div class="field__error" id="prop-err" aria-live="polite"></div>
      <div class="empty" id="empty"><span class="empty__icon" aria-hidden="true">🗓️</span>Ingen tidsforslag endnu.<br>Vælg en dato ovenfor for at komme i gang.</div>
      <ul class="proposals" id="proposals" aria-labelledby="prop-h"></ul>
      <div class="form-actions">
        <button type="reset" class="btn btn--ghost btn--block-m" id="cancel">Annullér</button>
        <button type="submit" class="btn btn--primary" id="submit">Opret afstemning</button>
      </div>
    </form>
    <p class="sr-only" id="live" aria-live="polite"></p>
  </main>
  <template id="date-group-tpl">
    <li class="date-group anim-in">
      <div class="date-group__head">
        <span class="date-group__title"></span>
        <button type="button" class="btn btn--icon js-remove-date">🗑</button>
      </div>
      <ul class="slots"></ul>
      <button type="button" class="btn btn--ghost js-add-slot">+ Tilføj tidspunkt</button>
    </li>
  </template>
  <template id="slot-tpl">
    <li class="slot anim-in">
      <input class="input js-start" type="time" lang="da" step="300" aria-label="Starttid">
      <span class="slot__sep">–</span>
      <input class="input js-end" type="time" lang="da" step="300" aria-label="Sluttid (valgfri)">
      <button type="button" class="btn btn--icon js-remove-slot" aria-label="Fjern tidspunkt">✕</button>
    </li>
  </template>
  <script src="/create.js"></script>
</body>
</html>
