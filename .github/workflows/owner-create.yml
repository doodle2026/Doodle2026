name: Owner – create/reset (prod)
# Creates or resets the owner login in the PRODUCTION DB.
# Usage: gh secret set OWNER_PASSWORD; gh workflow run owner-create.yml -f username=jan [-f reset=true];
#        then gh secret delete OWNER_PASSWORD. See docs/OWNER.md and docs/README-DEPLOY.md.
on:
  workflow_dispatch:
    inputs:
      username:
        description: Owner username
        type: string
        default: jan
        required: true
      reset:
        description: Reset password of existing owner (logs out everywhere)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: owner-ops
  cancel-in-progress: false
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: owner:create
        env:
          DATABASE_URL: ${{ secrets.PROD_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          U: ${{ inputs.username }}
          RESET: ${{ inputs.reset }}
        run: |
          set -euo pipefail
          if [ -z "${OWNER_PASSWORD:-}" ]; then echo "::error::Repo secret OWNER_PASSWORD is not set"; exit 1; fi
          if [ -z "${DATABASE_URL:-}" ]; then echo "::error::Repo secret PROD_DIRECT_URL is not set"; exit 1; fi
          if ! [[ "$U" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then echo "::error::Invalid username"; exit 1; fi
          args=(--username "$U")
          if [ "$RESET" = "true" ]; then args+=(--reset); fi
          printf '%s\n' "$OWNER_PASSWORD" | npm run --silent owner:create -- "${args[@]}"
