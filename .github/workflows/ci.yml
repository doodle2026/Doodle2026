name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: doodle
          POSTGRES_PASSWORD: doodle
          POSTGRES_DB: doodle_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doodle"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://doodle:doodle@localhost:5432/doodle_test?schema=public
      DIRECT_URL: postgresql://doodle:doodle@localhost:5432/doodle_test?schema=public
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci              # postinstall: prisma generate
      - run: npm run lint
      - run: npm run typecheck   # tsc --noEmit
      - run: npm run db:deploy   # prisma migrate deploy against the service container
      # Tests run `next build` (into .next-test, NODE_ENV=production) + `next start` themselves,
      # so this doubles as the production build check – no separate `npm run build` step.
      - run: npm test
      - name: Upload test server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-server-log
          path: .next-test/server.log
          retention-days: 3
          if-no-files-found: ignore
